name: "Test"

on:
  pull_request: # any base, so stacked PRs are tested too
  push:
    branches:
      - main

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: "Check formatting"
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
