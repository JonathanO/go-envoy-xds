name: "Test"

on:
  pull_request: # any base, so stacked PRs are tested too
  push:
    branches:
      - main

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # spec/, the vectors spectest runs
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: "Check formatting"
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: "Vet the examples"
        working-directory: examples
        run: go vet ./...
      - name: "Test the examples"
        working-directory: examples
        run: go test -race ./...
      - name: "Vet the vector runner"
        working-directory: spectest
        run: go vet ./...
      - name: "Run the vectors"
        working-directory: spectest
        run: go test -race ./...
